<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f2">
<title>Koto — きょうの余白をつくる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#" aria-label="Koto ホーム"><span class="brand-mark">k</span><span>koto<span class="brand-dot">.</span></span></a>
    <div class="workspace"><span class="workspace-avatar">N</span><span class="workspace-copy"><strong>Nyat のスペース</strong><small>個人ワークスペース</small></span><span class="chevron">⌄</span></div>
    <div class="side-label">ワークスペース</div>
    <nav class="main-nav" aria-label="メインメニュー">
      <button class="nav-item active" data-view="list"><span class="nav-icon">☷</span>すべてのタスク<span class="nav-count" id="open-count">0</span></button>
      <button class="nav-item" data-view="calendar"><span class="nav-icon">▦</span>カレンダー</button>
      <button class="nav-item" data-filter="today"><span class="nav-icon">◷</span>今日</button>
      <button class="nav-item" data-filter="upcoming"><span class="nav-icon">↗</span>近日中</button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" id="manage-tags"><span class="nav-icon">◇</span>タグを管理</button>
      <button class="nav-item" id="show-archive"><span class="nav-icon">▤</span>アーカイブ</button>
      <div class="profile"><span class="profile-avatar">N</span><span class="profile-copy"><strong>Nyat</strong><small>Google アカウント</small></span><button class="icon-button" aria-label="設定">⚙</button></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="icon-button mobile-menu" id="mobile-menu" aria-label="メニュー">☰</button><div class="breadcrumbs"><span>ワークスペース</span><span class="crumb-sep">/</span><strong id="breadcrumb-current">すべてのタスク</strong></div><div class="top-actions"><button class="icon-button search-trigger" id="search-trigger"><span>⌕</span><span class="search-label">検索</span><kbd>⌘ K</kbd></button><span class="top-divider"></span><button class="icon-button notification-button" id="notification-button" aria-label="通知">♧<i></i></button><button class="avatar-small">N</button></div></header>
    <section class="content">
      <div class="page-heading"><div><div class="eyebrow" id="date-label">MY SPACE · SUNDAY</div><h1 id="page-title">すべてのタスク</h1><p id="page-subtitle">頭の中のことを、ここに置いておこう。</p></div><button class="button primary add-task" id="new-task"><span>＋</span> タスクを追加</button></div>
      <div class="tab-bar"><div class="tab-bar-title">タスク</div><nav class="tab-nav" id="tab-nav" aria-label="タブ"></nav><button class="button add-tab-button" id="add-tab" aria-label="タブを追加">＋ <span>タブを追加</span></button><button class="icon-button tab-manage-button" id="manage-tabs-nav" aria-label="タブを管理">···</button></div>
      <div class="toolbar"><div class="view-switch" role="tablist" aria-label="表示切替"><button class="view-tab selected" data-view="list"><span>☷</span> リスト</button><button class="view-tab" data-view="calendar"><span>▦</span> カレンダー</button></div><div class="toolbar-right" id="list-tools"><div class="segmented" aria-label="タスク範囲"><button class="selected" data-scope="all">すべて</button><button data-scope="personal">個人</button><button data-scope="shared">共有 <span class="scope-dot"></span></button></div><button class="button secondary filter-button" id="filter-button"><span>☷</span> フィルター <span class="filter-count" id="filter-count"></span></button><button class="icon-button more-button" aria-label="その他">···</button></div><div class="toolbar-right calendar-tools hidden" id="calendar-tools"><div class="segmented" aria-label="カレンダー表示"><button class="selected" data-range="month">月</button><button data-range="week">週</button><button data-range="year">年</button></div><button class="button secondary today-button" id="calendar-today">今日</button></div></div>
      <div class="list-meta"><span id="result-count">0 件のタスク</span><button id="sort-button" class="text-button">期日順 <span>⌄</span></button></div>
      <div id="task-list" class="task-list"></div>
      <section id="calendar-view" class="calendar-view hidden"></section>
      <section id="archive-view" class="archive-view hidden"></section>
      <div class="empty-state hidden" id="empty-state"><div class="empty-illustration"><span>✳</span><i></i><b></b></div><h3>ここから、ひとつずつ。</h3><p>タスクを追加すると、ここに表示されます。</p><button class="button primary" id="empty-add">＋ 最初のタスクを追加</button></div>
      <footer class="content-footer"><span><span class="footer-spark">✳</span> 自分のペースで、大丈夫。</span><span>ローカルデモ · データはこのブラウザーに保存されます</span></footer>
    </section>
  </main>
</div>
<div class="toast-region" id="toast-region" aria-live="polite"></div>
<div class="modal-backdrop hidden" id="modal-backdrop">
  <section class="modal task-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-header"><div><span class="modal-kicker" id="modal-kicker">新しいタスク</span><h2 id="modal-title">何をする？</h2></div><button class="icon-button close-modal" aria-label="閉じる">×</button></header>
    <form id="task-form">
      <input type="hidden" id="task-id">
      <label class="field-label" for="task-title">タスク名</label><input class="title-input" id="task-title" maxlength="120" placeholder="たとえば、洗剤を買う" required>
      <label class="field-label" for="task-note">メモ <span>任意</span></label><textarea id="task-note" rows="2" placeholder="忘れないようにメモしておく"></textarea>
      <div class="field-row"><div class="field"><label class="field-label" for="task-start">開始日 <span>任意</span></label><input type="date" id="task-start"></div><div class="field"><label class="field-label" for="task-due">期限日 <span>任意</span></label><input type="date" id="task-due"></div></div>
      <div class="field-row"><div class="field"><label class="field-label" for="task-tab">タブ</label><select id="task-tab"></select></div><fieldset class="field"><legend class="field-label">管理方法</legend><div class="radio-pills"><label><input type="radio" name="task-kind" value="personal" checked><span>個人用</span></label><label><input type="radio" name="task-kind" value="shared"><span>共有用</span></label></div></fieldset></div>
      <div class="field"><label class="field-label" for="task-tags">タグ <span>複数選択可</span></label><div id="tag-picker" class="tag-picker"></div></div>
      <div class="field"><span class="field-label">写真 <span>最大2枚 · デモでは端末内のみ</span></span><label class="upload-box" for="task-photos"><span class="upload-icon">↥</span><span><strong>写真を追加</strong><small>クリックして画像を選ぶ</small></span><span class="upload-limit">0 / 2</span><input id="task-photos" type="file" accept="image/*" multiple></label><div id="photo-preview" class="photo-preview"></div></div>
      <div class="modal-actions"><button type="button" class="button secondary delete-task hidden" id="delete-task">アーカイブ</button><span class="action-spacer"></span><button type="button" class="button secondary cancel-modal">キャンセル</button><button class="button primary" type="submit">保存する <span>↗</span></button></div>
    </form>
  </section>
</div>
<div class="modal-backdrop hidden" id="small-modal-backdrop"><section class="modal small-modal" role="dialog" aria-modal="true"><header class="modal-header"><div><span class="modal-kicker" id="small-kicker">管理</span><h2 id="small-title"></h2></div><button class="icon-button close-small" aria-label="閉じる">×</button></header><div id="small-content"></div></section></div>
<div class="search-overlay hidden" id="search-overlay"><div class="search-panel"><span class="search-icon">⌕</span><input id="search-input" placeholder="タスクやタグを検索…" autocomplete="off"><kbd>ESC</kbd><div class="search-results" id="search-results"></div></div></div>
<script src="./app.js"></script>
</body>
</html>
